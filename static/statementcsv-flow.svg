<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">StatementCSV flow</title>
  <desc id="desc">PDF upload to in-memory parse, balance check, CSV or Excel download, file not retained</desc>
  <rect width="520" height="120" rx="12" fill="#1a2332" stroke="#2a3548"/>
  <rect x="16" y="28" width="100" height="64" rx="8" fill="#243044" stroke="#3d8bfd"/>
  <text x="66" y="58" text-anchor="middle" fill="#e7ecf3" font-family="system-ui,sans-serif" font-size="12" font-weight="700">PDF</text>
  <text x="66" y="76" text-anchor="middle" fill="#9aa8bc" font-family="system-ui,sans-serif" font-size="10">upload</text>
  <path d="M124 60 H154" stroke="#3d8bfd" stroke-width="2" marker-end="url(#a)"/>
  <rect x="160" y="28" width="110" height="64" rx="8" fill="#243044" stroke="#2dd4a8"/>
  <text x="215" y="58" text-anchor="middle" fill="#e7ecf3" font-family="system-ui,sans-serif" font-size="12" font-weight="700">RAM parse</text>
  <text x="215" y="76" text-anchor="middle" fill="#9aa8bc" font-family="system-ui,sans-serif" font-size="10">not retained</text>
  <path d="M278 60 H308" stroke="#3d8bfd" stroke-width="2"/>
  <rect x="314" y="28" width="100" height="64" rx="8" fill="#243044" stroke="#e6c07b"/>
  <text x="364" y="58" text-anchor="middle" fill="#e7ecf3" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Balance</text>
  <text x="364" y="76" text-anchor="middle" fill="#9aa8bc" font-family="system-ui,sans-serif" font-size="10">check</text>
  <path d="M422 60 H452" stroke="#3d8bfd" stroke-width="2"/>
  <rect x="458" y="28" width="46" height="64" rx="8" fill="#243044" stroke="#3d8bfd"/>
